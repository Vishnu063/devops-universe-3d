apiVersion: apps/v1
kind: Deployment
metadata:
  name: universe-learning-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: universe-learning-app
  template:
    metadata:
      labels:
        app: universe-learning-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: app
          image: universe-learning-app:lab
          imagePullPolicy: Never
          env:
            - name: APP_MESSAGE
              value: hello-from-kubernetes
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: universe-learning-app
  labels:
    app: universe-learning-app
spec:
  selector:
    app: universe-learning-app
  ports:
    - port: 80
      targetPort: 8080
