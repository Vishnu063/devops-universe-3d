name: Check and publish learning site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Publish publicly after enabling Settings > Pages > GitHub Actions
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: static-learning-site
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && (vars.ENABLE_PAGES == 'true' || inputs.publish_pages == true)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
